[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evateam-notifier"
version = "0.1.0"
description = "Бот-напоминалка о задачах из таск-трекера EvaTeam (Telegram, в будущем MAX)"
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["evateam_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
